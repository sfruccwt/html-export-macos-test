name: Test packaged HTML export on macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap without Node on PATH and verify reuse
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          mkdir -p runtime/installed-skill
          unzip skill-package/html-export-skill-20261014-r04.zip -d runtime/installed-skill
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/html-export-browsers"
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          if command -v node; then echo 'Node unexpectedly accessible'; exit 1; fi
          setup=runtime/installed-skill/html-export/scripts/setup-macos.sh
          bash "$setup" --runtime-dir "$GITHUB_WORKSPACE/runtime/auto" --browser chromium
          cp runtime/auto/node-setup.json runtime/first-node.json
          cp runtime/auto/setup-receipt.json runtime/first-setup.json
          bash "$setup" --runtime-dir "$GITHUB_WORKSPACE/runtime/auto" --browser chromium
          runtime/auto/node/bin/node -e 'const fs=require("fs"),read=p=>JSON.parse(fs.readFileSync(p));if(read("runtime/first-node.json").action!=="installed"||read("runtime/auto/node-setup.json").action!=="reused")throw Error("Node install/reuse failed");const first=read("runtime/first-setup.json"),second=read("runtime/auto/setup-receipt.json");if(!first.installed.includes("playwright")||!first.installed.includes("chromium")||second.installed.length)throw Error("Dependency install/reuse failed");console.log(JSON.stringify({firstNode:read("runtime/first-node.json"),secondNode:read("runtime/auto/node-setup.json"),first,second},null,2))'
      - name: Export both formats and each format separately
        shell: bash
        run: |
          set -euo pipefail
          for variant in both png-only jpg-only; do
            case "$variant" in
              both) formats=png,jpg ;;
              png-only) formats=png ;;
              jpg-only) formats=jpg ;;
            esac
            runtime/auto/node/bin/node runtime/installed-skill/html-export/scripts/export-html.mjs \
              --input source/demo.html --out-dir "output/$variant" \
              --formats "$formats" --selector '#poster' --scale 2 --transparent \
              --jpeg-background '#ffffff' --jpeg-quality 0.95 \
              --runtime-config "$GITHUB_WORKSPACE/runtime/auto/runtime.json"
          done
      - name: Decode images and return visual evidence through logs
        run: |
          python3 -m venv runtime/ci-python
          runtime/ci-python/bin/python -m pip install Pillow
          runtime/ci-python/bin/python run/verify-images.py output
